# Builds answers.json from the NYT endpoint (server-side, so no CORS) and
# deploys the site to GitHub Pages.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Refresh daily so newly published puzzles show up
  schedule:
    - cron: "17 3 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep previously fetched answers between runs so we only fetch what's new.
      - name: Restore answers cache
        uses: actions/cache@v4
        with:
          path: answers.json
          key: answers-${{ github.run_id }}
          restore-keys: answers-

      - name: Build answers.json
        run: node scripts/build-answers.mjs answers.json

      - name: Stage site
        run: |
          mkdir _site
          cp index.html answers.json _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
